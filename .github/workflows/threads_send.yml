name: threads-send
on:
  # 스레드 발행 일시 중지 (2026-09-19): 콘텐츠 품질 문제(한전KPS 도배·정규직 오표기)로 재정비 전까지
  # schedule:
  #   - cron: '5 22 * * *'
  #   - cron: '35 23 * * *'
  #   - cron: '5 1 * * *'
  #   - cron: '35 2 * * *'
  #   - cron: '5 4 * * *'
  #   - cron: '35 5 * * *'
  #   - cron: '5 7 * * *'
  #   - cron: '35 8 * * *'
  #   - cron: '5 10 * * *'
  #   - cron: '35 11 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: '특정 슬롯만 발송 (예: 14:00)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 정시 발송
        run: python send_queue.py ${{ inputs.slot && format('--slot {0}', inputs.slot) || '' }}
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_LIVE: '1'
      - name: 발송 상태 커밋
        run: |
          git config user.name "gongchwimoa-bot"
          git config user.email "gongchwimoa-bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add threads_queue.json publish_state.json 2>/dev/null || git add threads_queue.json
          git diff --cached --quiet || (git commit -m "Threads send: $(date -u +%Y-%m-%dT%H:%M)" && git push)
