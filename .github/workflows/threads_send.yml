name: threads-send
on:
  # 발송은 Hermes 에이전트(VPS)가 담당 (GitHub Actions 스케줄 비활성화 — 2026-09-19).
  # 슬롯별 정시 발행은 서버 cron이 send_queue.py --live로 실행.
  # 수동 보조용으로만 workflow_dispatch 유지.
  workflow_dispatch:
    inputs:
      slot:
        description: '특정 슬롯만 발송 (예: 14:00)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 정시 발송
        run: python send_queue.py ${{ inputs.slot && format('--slot {0}', inputs.slot) || '' }}
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_LIVE: '1'
      - name: 발송 상태 커밋
        run: |
          git config user.name "gongchwimoa-bot"
          git config user.email "gongchwimoa-bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add threads_queue.json publish_state.json 2>/dev/null || git add threads_queue.json
          git diff --cached --quiet || (git commit -m "Threads send: $(date -u +%Y-%m-%dT%H:%M)" && git push)
