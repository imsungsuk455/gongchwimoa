name: threads-send
on:
  schedule:
    # 공고 알림 전용 10개 슬롯 (KST = UTC+9). 빈 슬롯은 skip (콘텐츠성 글 없음).
    # 07:00=22, 08:30=23:30, 10:00=01, 11:30=02:30, 13:00=04, 14:30=05:30,
    # 16:00=07, 17:30=08:30, 19:00=10, 20:30=11:30
    - cron: '5 22 * * *'
    - cron: '35 23 * * *'
    - cron: '5 1 * * *'
    - cron: '35 2 * * *'
    - cron: '5 4 * * *'
    - cron: '35 5 * * *'
    - cron: '5 7 * * *'
    - cron: '35 8 * * *'
    - cron: '5 10 * * *'
    - cron: '35 11 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: '특정 슬롯만 발송 (예: 14:00)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 정시 발송
        run: python send_queue.py ${{ inputs.slot && format('--slot {0}', inputs.slot) || '' }}
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_LIVE: '1'
      - name: 발송 상태 커밋
        run: |
          git config user.name "gongchwimoa-bot"
          git config user.email "gongchwimoa-bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add threads_queue.json publish_state.json 2>/dev/null || git add threads_queue.json
          git diff --cached --quiet || (git commit -m "Threads send: $(date -u +%Y-%m-%dT%H:%M)" && git push)
