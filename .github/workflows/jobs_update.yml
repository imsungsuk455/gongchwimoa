name: jobs-update
on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-nanum
      - run: pip install pillow
      - name: 수집 (키 있으면 API, 없으면 HTML)
        run: |
          if [ -n "$DATA_GO_KR_KEY" ] && [ -n "$GOJOBS_API_ENDPOINT" ]; then python fetch_jobs.py; else python fetch_gojobs_html.py; fi
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          GOJOBS_API_ENDPOINT: ${{ secrets.GOJOBS_API_ENDPOINT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          MAX_THREADS_PER_DAY: '10'
      - name: 기사+썸네일 생성
        run: python gen_articles.py
      - name: AdSense 사전점검 (게이트)
        run: python check_adsense.py
      - name: 스레드 정시 발송 (수집 연동)
        run: python send_queue.py
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_LIVE: '1'
      - name: 커밋/푸시
        run: |
          git config user.name "gongchwimoa-bot"
          git config user.email "gongchwimoa-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Auto update: $(date -u +%Y-%m-%dT%H:%M)" && git push)
